  }, {passive:false});
})();

// Firestore REST helpers（SDK WebChannel 404 回避）
const FS_DOC_URL =
  "https://firestore.googleapis.com/v1/projects/" +
  firebaseConfig.projectId +
  "/databases/(default)/documents/" + STORAGE_COLLECTION + "/" + STORAGE_DOC;

function fromFirestoreValue(v) {
  if (v == null) return null;
  if ("stringValue" in v) return v.stringValue;
  if ("integerValue" in v) return Number(v.integerValue);
  if ("doubleValue" in v) return v.doubleValue;
  if ("booleanValue" in v) return v.booleanValue;
  if ("nullValue" in v) return null;
  if ("timestampValue" in v) return v.timestampValue;
  if ("arrayValue" in v) {
    const vals = (v.arrayValue && v.arrayValue.values) || [];
    return vals.map(fromFirestoreValue);
  }
  if ("mapValue" in v) {
    const fields = (v.mapValue && v.mapValue.fields) || {};
    const out = {};
    Object.keys(fields).forEach(function (k) {
      out[k] = fromFirestoreValue(fields[k]);
    });
    return out;
  }
  return null;
}

function firestoreDocToObject(doc) {
  if (!doc || !doc.fields) return null;
  const out = {};
  Object.keys(doc.fields).forEach(function (k) {
    out[k] = fromFirestoreValue(doc.fields[k]);
  });
  return out;
}

function toFirestoreValue(val) {
  if (val === null || val === undefined) return { nullValue: null };
  if (typeof val === "string") return { stringValue: val };
  if (typeof val === "boolean") return { booleanValue: val };
  if (typeof val === "number") {
    if (Number.isInteger(val)) return { integerValue: String(val) };
    return { doubleValue: val };
  }
  if (Array.isArray(val)) {
    return { arrayValue: { values: val.map(toFirestoreValue) } };
  }
  if (typeof val === "object") {
    const fields = {};
    Object.keys(val).forEach(function (k) {
      if (val[k] !== undefined) fields[k] = toFirestoreValue(val[k]);
    });
    return { mapValue: { fields: fields } };
  }
  return { stringValue: String(val) };
}

function objectToFirestoreDoc(obj) {
  const fields = {};
  Object.keys(obj).forEach(function (k) {
    if (obj[k] !== undefined) fields[k] = toFirestoreValue(obj[k]);
  });
  return { fields: fields };
}

async function loadNovelViaRest() {
  const url = FS_DOC_URL + "?key=" + encodeURIComponent(firebaseConfig.apiKey);
  const res = await fetch(url);
  if (res.status === 404) return null;
  if (!res.ok) {
    const text = await res.text();
    throw new Error("REST read " + res.status + ": " + text.slice(0, 200));
  }
  const doc = await res.json();
  return firestoreDocToObject(doc);
}

async function saveNovelViaRest(payload, idToken) {
  const body = objectToFirestoreDoc(payload);
  const headers = { "Content-Type": "application/json" };
  if (idToken) headers["Authorization"] = "Bearer " + idToken;
  const res = await fetch(FS_DOC_URL + "?key=" + encodeURIComponent(firebaseConfig.apiKey), {
    method: "PATCH",
    headers: headers,
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    const text = await res.text();
    throw new Error("REST write " + res.status + ": " + text.slice(0, 300));
  }
  return res.json();
}

function TitleAssemble({ text, charDelay = 70 }) {
  const [settled, setSettled] = useState(false);
  const chars = useMemo(() => Array.from(text || ""), [text]);
  // タイトルの改行位置（必要なら調整）
  const breakAfter = useMemo(() => {
    const t = text || "";
    return -1;
  }, [text]);
  useEffect(() => {
    setSettled(false);
    const t = setTimeout(() => setSettled(true), 80);
    return () => clearTimeout(t);
  }, [text]);
  const nodes = [];
  chars.forEach((ch, i) => {
    if (ch === "\n") {
      nodes.push(React.createElement("br", { key: "nl" + i, "aria-hidden": "true" }));
      return;
    }
    const h = (i * 9301 + 233) % 233280;
    const n = h / 233280;
    const dx = (n - 0.5) * 40,
      dy = ((n * 7) % 1 - 0.5) * 28,
      dr = ((n * 13) % 1 - 0.5) * 8;
    nodes.push(
      React.createElement(
        "span",
        {
          key: "c" + i,
          className: "title-char" + (settled ? " is-settled" : ""),
          style: {
            "--dx": dx + "px",
            "--dy": dy + "px",
            "--dr": dr + "deg",
            transitionDelay: i * charDelay + "ms"
          },
          "aria-hidden": "true"
        },
        ch === " " ? " " : ch
      )
    );
    if (i === breakAfter) {
      nodes.push(
        React.createElement("br", {
          key: "br",
          className: "title-break-mobile",
          "aria-hidden": "true"
        })
      );
    }
  });
  return React.createElement("span", { "aria-label": text }, nodes);
}

function EditableText({ value, onChange, multiline, lines, style, className, as }) {
  const { editing } = useContext(NovelContext);
  // lines: 改行を含められる短いテキスト（タイトル等）。改行はそのまま表示される
  if (lines) {
    if (!editing) {
      return React.createElement("span", { className, style: { whiteSpace: "pre-line", ...style } }, value);
    }
    return React.createElement("textarea", {
      value: value || "",
      onChange: (e) => onChange(e.target.value),
      rows: Math.max(1, (value || "").split("\n").length),
      className,
      style: {
        font: "inherit",
        color: "inherit",
        letterSpacing: "inherit",
        lineHeight: "inherit",
        background: "hsl(var(--accent) / 0.06)",
        border: "1px dashed hsl(var(--accent) / 0.35)",
        borderRadius: "2px",
        padding: "0.15rem 0.35rem",
        width: "100%",
        boxSizing: "border-box",
        resize: "none",
        overflow: "hidden",
        outline: "none",
        ...style
      }
    });
  }
  const Tag = as || (multiline ? "textarea" : "input");
  if (!editing) {
    if (multiline) {
      return React.createElement(
        "div",
        { className, style },
        typeof value === "string"
          ? value.split("\n").map((line, i) =>
              React.createElement("p", { key: i, style: { marginBottom: i < value.split("\n").length - 1 ? "1.4em" : 0 } }, line)
            )
          : value
      );
    }
    return React.createElement("span", { className, style }, value);
  }
  const baseStyle = {
    font: "inherit",
    color: "inherit",
    letterSpacing: "inherit",
    lineHeight: "inherit",
    background: "hsl(var(--accent) / 0.06)",
    border: "1px dashed hsl(var(--accent) / 0.35)",
    borderRadius: "2px",
    padding: multiline ? "0.5rem" : "0.15rem 0.35rem",
    width: "100%",
    boxSizing: "border-box",
    resize: multiline ? "vertical" : "none",
    outline: "none",
    ...style
  };
  if (multiline) {
    return React.createElement("textarea", {
      value: value || "",
      onChange: (e) => onChange(e.target.value),
      style: { ...baseStyle, minHeight: "6rem" },
      className,
      rows: Math.max(4, (value || "").split("\n").length + 1)
    });
  }
  return React.createElement("input", {
    type: "text",
    value: value || "",
    onChange: (e) => onChange(e.target.value),
    style: baseStyle,
    className
  });
}

function Read({ route }) {
  const { meta, chapters, updateChapterTitle, updateChapterBody, editing } = useContext(NovelContext);
  const match = route.match(/^\/read\/(\d+)$/);
  const num = match ? match[1] : null;
  const chapter = useMemo(
    () => chapters.find((c) => c.num === Number(num)),
    [chapters, num]
  );
  const [fontIndex, setFontIndex] = useState(() => {
    const s = Number(localStorage.getItem("novelblank:fontIndex"));
    return Number.isFinite(s) ? Math.min(SIZES.length - 1, Math.max(0, s)) : 2;
  });
  const [dark, setDark] = useState(() => localStorage.getItem("novelblank:dark") === "1");
  const [progress, setProgress] = useState(0);
  useEffect(() => {
    localStorage.setItem("novelblank:fontIndex", String(fontIndex));
  }, [fontIndex]);
  useEffect(() => {
    localStorage.setItem("novelblank:dark", dark ? "1" : "0");
  }, [dark]);
  useEffect(() => {
    const r = document.documentElement;
    if (dark) r.classList.add("dark");
    else r.classList.remove("dark");
    return () => r.classList.remove("dark");
  }, [dark]);
  useEffect(() => {
    window.scrollTo({ top: 0, behavior: "auto" });
    setProgress(0);
  }, [num]);
  useEffect(() => {
    const onScroll = () => {
      const doc = document.documentElement;
      const max = doc.scrollHeight - doc.clientHeight;
      setProgress(max > 0 ? Math.min(1, Math.max(0, doc.scrollTop / max)) : 0);
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener("scroll", onScroll);
  }, [num]);

  if (!chapter) {
    return React.createElement(
      "main",
      {
        style: {
          minHeight: "100vh",
          background: "var(--offwhite)",
          color: "var(--charcoal)",
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          padding: "0 1.5rem"
        }
      },
      React.createElement(
        "div",
        { style: { textAlign: "center" } },
        React.createElement(
          "p",
          {
            className: "font-heading",
            style: { fontSize: "1.5rem", letterSpacing: "0.1em", marginBottom: "1.5rem" }
          },
          "話が見つかりません"
        ),
        React.createElement(
          "a",
          {
            href: "#/contents",
            style: {
              fontFamily: "var(--font-body)",
              fontSize: "0.875rem",
              color: "var(--charcoal)",
              opacity: 0.6
            }
          },
          "目次へ戻る"
        )
      )
    );
  }

  const fontSize = SIZES[fontIndex].value;
  const totalChapters = chapters.length;
  const prev = chapter.num > 1 ? chapter.num - 1 : null;
  const next = chapter.num < totalChapters ? chapter.num + 1 : null;
  const numStr = String(chapter.num).padStart(2, "0");
  const nextChapter = next ? chapters.find((c) => c.num === next) : null;

  return React.createElement(
    "main",
    {
      style: {
        position: "relative",
        minHeight: "100vh",
        background: "hsl(var(--background))",
        color: "hsl(var(--foreground))"
      }
    },
    React.createElement(
      "header",
      {
        style: {
          position: "sticky",
          top: 0,
          zIndex: 20,
          background: "hsl(var(--background) / 0.85)",
          backdropFilter: "blur(8px)",
          borderBottom: "1px solid hsl(var(--border) / 0.4)"
        }
      },
      React.createElement(
        "div",
        {
          style: {
            maxWidth: "42rem",
            margin: "0 auto",
            padding: "0 1.25rem",
            height: "3.5rem",
            display: "flex",
            alignItems: "center",
            justifyContent: "space-between",
            gap: "0.75rem"
          }
        },
        React.createElement(
          "a",
          {
            href: "#/contents",

              alignItems: "center",
              gap: "6px",
              fontFamily: "var(--font-body)",
              fontSize: "0.75rem",
              color: "hsl(var(--muted-foreground))",
              flexShrink: 0
            }
          },
          React.createElement(Icon, {
            w: 14,
            h: 14,
            d: ["M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"]
          }),
          React.createElement("span", { className: "sm-inline" }, "目次")
        ),
        React.createElement(
          "span",
          {
            className: "font-display",
            style: {
              fontSize: "0.75rem",
              letterSpacing: "0.3em",
              color: "hsl(var(--muted-foreground))",
              overflow: "hidden",
              textOverflow: "ellipsis",
              whiteSpace: "nowrap"
            }
          },
          (meta.title || "").replace(/\n/g, " ")
        ),
        React.createElement(ReadingControls, { fontIndex, setFontIndex, dark, setDark })
      ),
      React.createElement(
        "div",
        {
          style: {
            height: "1px",
            width: "100%",
            background: "hsl(var(--border) / 0.4)"
          }
        },
        React.createElement("div", {
          style: {
            height: "100%",
            background: "var(--wine)",
            transformOrigin: "left",
            width: progress * 100 + "%",
            transition: "width 150ms ease-out"
          }
        })
      )
    ),
    React.createElement(
      "article",
      { style: { maxWidth: "42rem", margin: "0 auto", padding: "4rem 1.5rem 6rem" } },
      React.createElement(
        "div",
        { style: { textAlign: "center", marginBottom: "4rem" } },
        React.createElement(
          "p",
          {
            className: "font-display",
            style: {
              letterSpacing: "0.4em",
              textTransform: "uppercase",
              fontSize: "0.65rem",
              color: "hsl(var(--muted-foreground))",
              marginBottom: "1.25rem"
            }
          },
          "Chapter " + numStr
        ),
        React.createElement(
          "h1",
          {
            className: "font-heading",
            style: {
              fontWeight: 300,
              fontSize: "1.5rem",
              lineHeight: 1.6,
              letterSpacing: "0.08em",
              color: "hsl(var(--foreground))"
            }
          },
          React.createElement(EditableText, {
            value: chapter.title,
            onChange: (v) => updateChapterTitle(chapter.num, v),
            style: {
              background: editing ? "hsl(var(--accent) / 0.06)" : "transparent",
              border: editing ? "1px dashed hsl(var(--accent) / 0.35)" : "none",
              textAlign: "center",
              fontWeight: 300,
              letterSpacing: "0.08em",
              fontSize: "inherit",
              width: "100%",
              color: "inherit"
            }
          })
        ),
        React.createElement("div", {
          style: {
            margin: "2rem auto 0",
            height: "1px",
            width: "2.5rem",
            background: "var(--wine)"
          }
        })
      ),
      React.createElement(
        "div",
        {
          className: "novel-text",
          style: { fontSize, color: "hsl(var(--foreground) / 0.88)" }
        },
        editing
          ? React.createElement("textarea", {
              value: (chapter.paragraphs || []).join("\n\n"),
              onChange: (e) => updateChapterBody(chapter.num, e.target.value),
              style: {
                display: "block",
                width: "100%",
                font: "inherit",
                fontFamily: "var(--font-body)",
                fontSize: "inherit",
                lineHeight: 1.95,
                letterSpacing: "0.04em",
                color: "inherit",
                background: "hsl(var(--accent) / 0.06)",
                border: "1px dashed hsl(var(--accent) / 0.35)",
                borderRadius: "2px",
                padding: "0",
                margin: "0",
                minHeight: "70vh",
                resize: "vertical",
                boxSizing: "border-box",
                outline: "none",
                whiteSpace: "pre-wrap",
                textAlign: "start",
                overflowWrap: "break-word",
                wordBreak: "normal"
              },
              rows: Math.max(20, (chapter.paragraphs || []).length * 3)
            })
          : (chapter.paragraphs || []).map((p, i) => {
              const isDialogue = typeof p === "string" && p.trimStart().startsWith("「");
              return React.createElement(
                "p",
                {
                  key: i,
                  style: isDialogue ? { textIndent: 0 } : undefined,
                  className: isDialogue ? "dialogue" : undefined
                },
                p
              );
            })
      ),
      React.createElement(
        "div",
        { style: { marginTop: "5rem" } },
        React.createElement(
          "div",
          {
            style: {
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              gap: "0.75rem",
              color: "hsl(var(--muted-foreground) / 0.5)"
            }
          },
          React.createElement("span", {
            style: { height: "1px", width: "2rem", background: "currentColor" }
          }),
          React.createElement(
            "span",
            {
              className: "font-display",
              style: { fontSize: "0.75rem", letterSpacing: "0.3em" }
            },
            numStr + " / " + String(totalChapters).padStart(2, "0")
          ),
          React.createElement("span", {
            style: { height: "1px", width: "2rem", background: "currentColor" }
          })
        ),
        React.createElement(
          "div",
          {
            style: {
              marginTop: "2.5rem",
              display: "flex",
              alignItems: "center",
              justifyContent: "space-between",
              gap: "1rem"
            }
          },
          prev
            ? React.createElement(
                "a",
                {
                  href: "#/read/" + prev,
                  style: {
                    display: "flex",
                    alignItems: "center",
                    gap: "0.5rem",
                    fontFamily: "var(--font-body)",
                    fontSize: "0.875rem",
                    color: "hsl(var(--muted-foreground))"
                  }
                },
                React.createElement(Icon, { w: 16, h: 16, d: ["m15 18-6-6 6-6"] }),
                React.createElement("span", { className: "sm-inline" }, "前話")
              )
            : React.createElement("span", { style: { width: "3rem" } }),
          React.createElement(
            "a",
            {
              href: "#/contents",
              style: {
                fontFamily: "var(--font-body)",
                fontSize: "0.75rem",
                letterSpacing: "0.2em",
                color: "hsl(var(--muted-foreground))"
              }
            },
            "目次"
          ),
          next
            ? React.createElement(
                "a",
                {
                  href: "#/read/" + next,
                  style: {
                    display: "flex",
                    alignItems: "center",
                    gap: "0.5rem",
                    fontFamily: "var(--font-body)",
                    fontSize: "0.875rem",
                    color: "hsl(var(--muted-foreground))"
                  }
                },
                React.createElement("span", { className: "sm-inline" }, "次話"),
                React.createElement(Icon, { w: 16, h: 16, d: ["m9 18 6-6-6-6"] })
              )
            : React.createElement("span", { style: { width: "3rem" } })
        ),
        next &&
          nextChapter &&
          React.createElement(
            "p",
            {
              style: {
                marginTop: "1.5rem",
                textAlign: "center",
                fontFamily: "var(--font-body)",
                fontSize: "0.75rem",

                letterSpacing: "0.05em"
              }
            },
            nextChapter.title
          ),
        !next &&
          React.createElement(
            "p",
            {
              style: {
                marginTop: "1.5rem",
                textAlign: "center",
                fontFamily: "var(--font-heading)",
                fontSize: "0.875rem",
                letterSpacing: "0.2em",

              }
            },
            "── 完 ──"
          )
      )
    )

function App() {
  const route = useHashRoute();
  const [meta, setMeta] = useState(() => ({ ...defaultNovelMeta }));
  const [chapters, setChapters] = useState(() =>
    defaultChapters.map((c) => ({ ...c, paragraphs: [...c.paragraphs] }))
  );
  const [editing, setEditing] = useState(false);
  const [saving, setSaving] = useState(false);
  const [dirty, setDirty] = useState(false);
  const [loaded, setLoaded] = useState(false);
  const [loadError, setLoadError] = useState(null);
  const [user, setUser] = useState(null);
  const [authReady, setAuthReady] = useState(false);
  const [showLogin, setShowLogin] = useState(false);

  useEffect(() => {
    if (!auth) {
      setAuthReady(true);
      return;
    }
    const unsub = auth.onAuthStateChanged((u) => {
      setUser(u);
      setAuthReady(true);
      if (!u) setEditing(false);
    });
    return () => unsub();
  }, []);

  // まずローカルのデフォルトで画面を出し、Firestore は裏で同期する
  useEffect(() => {
    setLoaded(true);
  }, []);

  useEffect(() => {
    let cancelled = false;

    try {
      const raw = localStorage.getItem("novelblank:chapters");
      if (raw) {
        const localChs = JSON.parse(raw);
        if (Array.isArray(localChs) && localChs.length > 0) {
          setChapters(
            localChs.map((c) => ({
              ...c,
              paragraphs: Array.isArray(c.paragraphs) ? [...c.paragraphs] : []
            }))
          );
          console.info("Loaded chapters from localStorage");
        }
      }
    } catch (e) {
      console.warn("localStorage chapters load failed", e);
    }

    const applyData = (data) => {
      if (!data) return;
      if (data.meta) {
        setMeta({
          ...defaultNovelMeta,
          ...data.meta,
          characters: data.meta.characters || defaultNovelMeta.characters,
          timeline: data.meta.timeline || defaultNovelMeta.timeline
        });
      }
      if (data.chapters && Array.isArray(data.chapters) && data.chapters.length > 0) {
        setChapters(
          data.chapters.map((c) => ({
            ...c,
            paragraphs: Array.isArray(c.paragraphs) ? [...c.paragraphs] : []
          }))
        );
        try { localStorage.setItem("novelblank:chapters", JSON.stringify(data.chapters)); } catch (e) {}
      }
    };

    (async () => {
      try {
        const data = await loadNovelViaRest();
        if (cancelled) return;
        if (data) {
          applyData(data);
          console.info("Firestore REST data loaded");
          return;
        }
        console.info("No Firestore doc via REST — using defaults");
      } catch (restErr) {
        console.warn("REST load failed, trying SDK:", restErr);
      }
      try {
        if (!db) return;
        const snap = await Promise.race([
          db.collection(STORAGE_COLLECTION).doc(STORAGE_DOC).get(),
          new Promise((_, reject) =>
            setTimeout(() => reject(new Error("Firestore timeout")), 8000)
          )
        ]);
        if (cancelled) return;
        if (snap && snap.exists) {
          applyData(snap.data());
          console.info("Firestore SDK data loaded");
        }
      } catch (err) {
        console.warn("Firebase load failed, using defaults:", err);
        if (!cancelled) setLoadError(String(err && err.message ? err.message : err));
      }
    })();

    return () => {
      cancelled = true;
    };
  }, []);

  const markDirty = useCallback(() => setDirty(true), []);

  const updateMeta = useCallback((partial) => {
    setMeta((m) => ({ ...m, ...partial }));
    setDirty(true);
  }, []);

  const updateChapterTitle = useCallback((num, title) => {
    setChapters((chs) =>
      chs.map((c) => (c.num === num ? { ...c, title } : c))
    );
    setDirty(true);
  }, []);

  const updateChapterBody = useCallback((num, text) => {
    // 空行（2つ以上の改行）で段落分割。全文を一括編集できる
    const cleaned = String(text || "")
      .replace(/\r\n/g, "\n")
      .split(/\n\n+/)
      .map((s) => s.replace(/^\n+|\n+$/g, ""))
      .filter((s) => s.length > 0);
    setChapters((chs) =>
      chs.map((c) => (c.num === num ? { ...c, paragraphs: cleaned } : c))
    );
    setDirty(true);
  }, []);

  const saveToFirebase = useCallback(async () => {
    if (!auth || !auth.currentUser) {
      alert("保存するにはログインが必要です。EDIT からログインしてください。");
      setShowLogin(true);
      return;
    }
    setSaving(true);
    try {
      localStorage.setItem("novelblank:chapters", JSON.stringify(chapters));
      localStorage.setItem("novelblank:meta", JSON.stringify(meta));
      console.info("Saved chapters to localStorage");
    } catch (lsErr) {
      console.warn("localStorage save failed:", lsErr);
    }
    
    const payload = {
      meta: meta,
      chapters: chapters,
      updatedAt: new Date().toISOString()
    };
    try {
      const idToken = await auth.currentUser.getIdToken();
      try {
        await saveNovelViaRest(payload, idToken);
        setDirty(false);
        console.info("Saved via REST");
        return;
      } catch (restErr) {
        console.warn("REST save failed, trying SDK:", restErr);
      }
      if (!db) throw new Error("Firestore に接続できません");
      await db.collection(STORAGE_COLLECTION).doc(STORAGE_DOC).set({
        meta: meta,
        chapters: chapters,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      setDirty(false);
      console.info("Saved via SDK");
    } catch (err) {
      console.error("Save failed:", err);
      setDirty(false);
      alert("クラウド保存に失敗しました（端末内には保存済み）: " + (err && err.message ? err.message : err));
    } finally {
      setSaving(false);
    }
  }, [meta, chapters]);

  const logout = useCallback(async () => {
    try {
      if (auth) await auth.signOut();
      setEditing(false);
      setShowLogin(false);
    } catch (err) {
      console.error("Logout failed:", err);
    }
  }, []);

  const ctx = {
    meta,
    chapters,
    editing,
    setEditing,
    saving,
    dirty,
    updateMeta,
    updateChapterTitle,
    updateChapterBody,
    saveToFirebase,
    user,
    showLogin,
    setShowLogin,
    logout
  };

  let page;
  if (!loaded) {
    page = React.createElement(
      "main",
      {
        style: {
          minHeight: "100vh",
          background: "var(--charcoal)",
          color: "var(--offwhite)",
          display: "flex",
          alignItems: "center",
          justifyContent: "center"
        }
      },
      React.createElement(
        "p",
        {
          className: "font-display",
          style: { letterSpacing: "0.3em", fontSize: "0.85rem", opacity: 0.6 }
        },
        "Loading…"
      )
    );
  } else if (route === "/" || route === "") {
    page = React.createElement(Home);
  } else if (route === "/contents") {
    page = React.createElement(Contents);
  } else if (route.startsWith("/read/")) {
    page = React.createElement(Read, { route });
  } else {
    page = React.createElement(
      "main",
      {
        style: {
          minHeight: "100vh",
          background: "var(--offwhite)",
          color: "var(--charcoal)",
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          padding: "0 1.5rem"
        }
      },
      React.createElement(
        "div",
        { style: { textAlign: "center" } },
        React.createElement(
          "p",
          {
            className: "font-heading",
            style: { fontSize: "1.5rem", letterSpacing: "0.1em", marginBottom: "1.5rem" }
          },
          "ページが見つかりません"
        ),
        React.createElement(
          "a",
          {
            href: "#/",
            style: {
              fontFamily: "var(--font-body)",
              fontSize: "0.875rem",
              color: "var(--charcoal)",
              opacity: 0.6
            }
          },
          "表紙へ戻る"
        )
      )
    );
  }

  return React.createElement(
    NovelContext.Provider,
    { value: ctx },
    React.createElement(
      React.Fragment,
      null,
      page,
      React.createElement(PageFlash),
      loaded && React.createElement(EditToolbar)
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
