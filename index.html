 {

  "title": "第十四話：犬吠埼",
  "paragraphs": [
   "路肩に停めておいた車に身を滑り込ませ、ドアを閉めると、密閉された車内に僕たちの重い吐息が残響のように満ちた。エンジンをかけると低い振動が響き渡り、僕たちは真っ暗な九十九里浜を後にした。潮騒の音を引きちぎるようにして夜の国道へ躍り出てからは、一度もアクセルを踏み緩めることなく、ただひたすらに車を走らせ続けた。途切れた街灯と街灯のあわいを幾度も突き抜け、闇を切り裂くヘッドライトの光だけを頼りに流れていく景色の果てを目指した。そうして辿りついたのは、関東最東端、太平洋に向かって爪のように鋭く突出した犬吠埼の岬だった。",
   "車を降りると、潮風は先ほどよりも一段と冷たく切り立ち、湿った岩肌を打ちつける波音が荒々しく響いていた。周囲を見渡せば、ちょうど東の地平線が仄かに白み始め、深い群青から淡い紫へと溶け込んでいく黎明の薄い光が、世界をそっと包み込み始めているところだった。空と海のあいだに引かれた境界線が薄っすらと浮かび上がり、夜の重厚な闇は、ゆっくりと新しい朝の光に押し流されようとしていた。",
   "「すごい、夜明けだ」",
   "「ああ、ほんとだ」",

   "「そろそろ来るな」",
   "キズキがそう口にした瞬間、まるで世界そのものが大きく息を呑んだかのように、波打ち際から潮がさっと引き、あたり一面に濃密な静寂が降りてきた。ざわめいていた潮風も、遠くの波音も一瞬にして掻き消え、まるでこの一刻だけ、世界からあらゆる音が綺麗に抜き取られてしまったかのように、どこまでも透明な静寂が訪れた。そして次の瞬間、張り詰めた闇を打ち破るようにして、眩い光が世界を溢れんばかりに満たした。再び生き返ったように寄せては返す波音が耳に届き始めた頃には水平線の彼方から真っ赤な天球が姿を現し、力強い朝日が静かに昇っていた。太陽が顔を出すと、それまで天空を重重しく覆っていた深い藍色は急速にその色を失って澄み渡り、足元に広がる冷たかった砂浜は、光の粒子を浴びて一瞬にして美しい黄金色へと染め上げられていった。それはまるで世界が古い姿を未練なく捨て去り、真新しい光の姿を手に入れる、まさにその瞬間だった。",
   "「すごい眺めだね」",
   "「ああ、そうだな」",
   "僕たちは言葉を交わすことも忘れ、その圧倒的な光景をただ息を呑んで眺めていた。水平線から溢れ出した眩い光は、またたく間に世界の隅々までを満たし、視界のすべてが眩いばかりの輝きで溢れかえっていた。あまりにも美しい光景だったので、僕たちはそれから三十分ほどの間、潮風に身を晒したまま、ただ無言でその朝日を眺め続けた。ふと我に返り、隣に立つキズキの横顔を見やると、そこには穏やかな微笑を口許に湛えた彼の姿があった。しかしその温かな微笑みはやがて、夕暮れの残光のようにゆっくりと彼の奥深くへと消え去っていってしまった。そしてあとに残されたのは、荒涼とした大地を見つめるような、どこか物悲しい眼差しだけだった。その瞳の奥には、今まさに世界を照らし出している朝日の眩い光でさえも一切受けつけないような、どこまでも深い、深い闇が横たわっていた。そしてその眼差しは水平線の彼方を超え、もっと遠く、深い場所をただ静かに見つめていた。",
   "　",
   "レンタカー店に借りていた車を返却し、僕たちが寮の門をくぐったのは午前十時のことだった。寮に戻るなり、無断で夜を明かした──外泊届けを出していなかった──ことで、僕たちは待ち構えていた寮長からこっぴどく叱られた。迅雷のような説教は小一時間も続き、もう少しで大学の講義に遅刻してしまうところだった。それでもなんとか走って教室へ滑り込み、ギリギリで出席カードを通すことができた。",
   "講義が終わると僕たちは逃げるように寮へ戻り、それぞれの自室のベッドに倒れ込むようにして眠りについた。二人とも昨夜は一睡もせず、ただひたすら車を走らせて夜を駆け抜けていたから、身体は鉛のように重く、シーツの冷たさに触れた瞬間に意識が遠のいていった。まぶたを閉じる間際、僕は頭の中でもう一度だけ、あのどこか滑稽で愉快な一夜の出来事について思いを巡らせた。海ほたるの潮風の匂い、九十九里浜の満天の星空、そして犬吠埼で見た、言葉を失うほどに美しい朝日の光。どこまでも長く、険しく、そして心地よい夜だった。僕たちはその幸福な疲労感の中で、自分たちの時間がこの先も、いつまでも続いていくのだと疑わずに信じ切っていた。しかしその夢のようなひとときは翌朝、あまりにも唐突に、無惨に引きちぎられることになる。何故なら、あの夜から五日が経った頃にはもう、キズキが死んでいたのだから──。",
   "　",
   "キズキが死んだと僕が理解したのは、あの長く奇妙な夜から数えて五日目のことだった。泥のような深い眠りから目を覚ますと、すでに窓の外は傾きかけた午後の陽射しに切り取られていた。鉛のように重い身体を引きずりながらベッドの上で身を起こすと、そこにあるべきキズキの姿は、どこにも見当たらなかった。皺ひとつなく綺麗に整えられたままのシーツは、彼がそこで休んだ痕跡すらないことを無言で告げていた。はじめのうちは、どこかへふらりと散歩にでも出かけたのだろうと高を括っていた。しかし窓の外の景色がゆっくりと群青色の闇に沈み、冷たい夜がすっかり更けてしまっても、彼は一向に寮へ戻ってくる気配を見せなかった。少しばかりの胸のざわめきを覚え、どこかで外泊でもしているのかと古びた事務室へ足を運び、寮長に尋ねてみた。しかし、しかめ面をした寮長は「アイツから外泊届は出されていない」と素っ気なく答えるだけだった。寮長もまた、キズキがいつ寮を出て行ったのか、その行方をまったく把握していなかったのだ。僕は自室でトヲルと顔を突き合わせ、とりあえず一晩だけ様子を見ることに決めた。というのも、キズキには時折、誰にも何も告げることなくふらっと外へ姿を消してしまう、迷い猫のような癖があったからだ。いつもの気まぐれだろう。僕たちはそう自分たちに言い聞かせることで、心の奥底で蠢き始めた得体の知れない不安を無理やり押し殺した。",
   "ところが、翌日になっても事態は変わらなかった。キズキは依然として寮に戻ってこなかったのだ。流石に事の異常さに気づいた寮長も渋い顔つきになり、キズキの携帯へ何度か連絡を入れた。しかし、電子的な呼び出し音は空虚な空間に響き続けるだけで、彼がその電話に出ることは二度となかった。キズキは、まるで最初からこの世界に存在していなかったかのように、外出をしたきり、ぷっつりと途絶えてしまった。",
   "彼が自ら命を絶ったという決定的な事実を知らされたのは、それからさらに三日の空白を経た後のことだった。詳しい経緯は、僕やトヲルにはすぐには呑み込めなかった。どうやら管轄の警察署から寮へ直接電話が入り、キズキが自殺を図り、すでにこの世を去っているという事実だけが事務的に告げられたようだった。受話器を置いた寮長は、いつもとは違うひどく青ざめた顔色で僕たちの部屋をノックし、真っ先にその重苦しい事実を伝えてきた。「キズキが死んだ」。その短い言葉は、僕たちの間に落ちた冷たい石のように、重く、そして暴力的なまでの響きを持っていた。",
   "翌日、僕たちは警察署に呼び出され、殺風景な部屋で事情聴取を受けることになった。灰色の壁と蛍光灯の冷たい光の下で、警察官の口から語られる彼の最期は、あの美しい朝日の記憶とは対極にある、あまりにも無機質で現実味を欠いたものだった。そして僕たちがキズキの死の生々しい詳細と、彼が一人で抱え込んでいた深い闇の正体を思い知らされることになったのも、まさにこの事情聴取を受けていたときのことだった。",
   "　",
   "警察官が無機質な調子で淡々と語る言葉によれば、キズキの遺体が見つかったのは、長野県の山間にぽつんと取り残された、すでに廃業して久しいホテルの浴槽の中だったという。そのホテルは半年前、経営者の一人が地方自治体の観光業振興のための県の補助金を不正に受給していたことが明るみに出たことで、地域社会からの信用を根底から失い、破綻へと追い込まれた施設だった。当時、その事件は地元の新聞で大々的に報じられて大きな騒動となったばかりか、全国放送のニュース番組でも社会の歪みを示す一例として二度にわたってピックアップされていた。キズキがその遠く離れた廃ホテルに目をつけたのも、恐らくは図書室の隅でめくった地方紙の片隅か、あるいは深夜のテレビ画面の奥に映し出されたそのニュースを、何らかの拍子で目にし、記憶していたからではないか──警察はそう推測していた。",
   "ホテルは廃業宣告を受けて以来、誰一人として管理する者もなく、ただ時の風化に任せて放置されていた。周囲を囲む雑草は生い茂り、外壁を叩く雨風によって窓ガラスは幾重にも蜘蛛の巣状のひびを刻み、剥がれ落ちた壁紙が湿り気を帯びて冷たく垂れ下がっていた。夜風が通り抜けるたびに、誰もいない空室の木製ドアがギィギィと嫌な音を立てて軋むような、完全に世界から忘れ去られた廃墟と化していたのだ。キズキの冷たくなった遺体が発見されたのは、そのホテルの二階奥にある、一室のツインルームの浴室で、第一発見者は週末の夜に好奇心本位で肝試しに忍び込んだという地元の高校生たちだった。彼らは闇の中で懐中電灯の光を泳がせ、足を踏み入れた浴室の浴槽の中で、両手首から流れ出た途方もない量の血の海に浸かるキズキの姿を目撃したのだという。しかし警察官が語った中で最も僕たちの胸を締め付けたのは、その凄惨な死の状況ではなく、彼が最期を迎えた部屋の異常な姿だった。ホテルのあらゆる空間が埃と落書きで荒れ果てていた中で、キズキが自らの死に場所として選んだそのツインルームの室内、浴室、そして洗面所だけが、まるで今さっき高級ホテルの清掃員が仕事を終えたばかりであるかのように、恐ろしいほど完璧に整えられていたのだった。警察官は感情を殺した淡々とした声で、「現場に入った捜査員が、その整然とした様に思わずため息を漏らしたほどでした」と呟き、僕とトヲルに数枚の現場写真を差し出した。指先に触れる冷たい写真には、確かにキズキが自分の手で整えたという部屋が写し出されていた。黄ばんで破れていたはずのツインベッドには、彼がわざわざ持ち込んだと思われるシーツの皺ひとつない真っ白な生地が完璧に張り巡らされていた。洗面所の鏡は綺麗に磨き上げられ、棚には新品の歯ブラシや折りたたまれたタオルといったアメニティ類が、ミリ単位の狂いもなく一列に美しく並べられていた。僕とトヲルはその狂気すら孕んだあまりにも整然とした部屋の写真の一枚一枚を、震える指先で静かに手に取り、死を前にしたキズキがその手で残そうとした言葉にならない何かの気配を、必死に感じ取ろうとした。しかしどれだけ指を滑らせても、そこにキズキの抱えた何かを感じることができなかった。",
   "完璧に整えられたベッドや洗面所とは惨烈な対比をなすように、彼が命を散らした浴槽の中だけは、目を背けたくなるほど凄惨な朱色に染まっていたという。当初、その遺体の凄まじい損傷と血の海から、警察内部でも他殺の可能性が疑われたほどだった。しかし血の海と化した浴槽の縁に、吸い殻を幾つも溜め込んだ陶器の灰皿が整然と置かれていたこと、そして冷たくなった彼の手元には、自身の指紋がくっきりと残された使い捨ての剃刀が落ちていたことなどを総合的に照らし合わせた結果、捜査は事件性のない純粋な自殺であるという結論に至った。つまりキズキは、補助金の不正受給によって放置された廃ホテルという存在を何らかの方法で見つけ出し、あのどこまでも長く、奇妙で美しい夜の旅を終えたまさにその翌日、誰にも何も告げずにひとり密かに寮を抜け出したのだ。そして電車とバスを乗り継ぎ、人知れず長野の廃墟へと足を踏み入れ、たったひとりで部屋の隅々まで磨き上げ、真っ白なシーツを敷き詰め、一本の煙草を静かに燻らせながら、自らの刃で手首を切り裂き、ゆっくりとこの世界から去っていったのだ。死因は手首の静脈を深く切ったことによる出血死。警察が割り出した彼の死亡推定時刻は、あの夜から数えて三日後の、闇が最も深く沈み込む夜中の十一時だった。",
   "　",
   "警察はキズキの凄惨な最期についての説明を淡々と終えると、手元の黒いメモ帳に視線を落とし、まずは高校時代からの古い友人であったトヲルに向かって、彼の日頃の様子や言動についての聞き取りを始めた。トヲルが絞り出すような低い声で短く答えていくのを横目で眺めながら、僕は冷たいパイプ椅子の感触にただひたすら耐えていた。やがて警察官の硬い眼差しが、今度は僕へと向けられた。いくつか事務的な確認がなされた後、刑事は僕の目をまっすぐに見つめながら問いかけてきた。",
   "「キズキ君に、自死を匂わせるような兆候や、悩んでいる素振りはありましたか？」",
   "僕は重い首を縦に振る気力もなく、ただ小さく横に振った。すると刑事は手帳のページをくくり、寮長から聞いたのであろう情報を確かめるように語気を強めた。",
   "「それでは、彼が命を絶つ直前、ドライブをした目的は何だったのですか？ なぜあのタイミングで九十九里や犬吠埼へ向かったのですか？」",

   "大学に戻ってからの日々は、奇妙な静けさに包まれていた。寮の部屋からキズキの私物が運び出されたあと、隣の部屋はしばらく空室のままだった。寮長も、他の寮生たちも、その部屋の前を通るときだけ、少しだけ声を潜めるようになった。誰もキズキの名前を口にしなかったし、誰も口にしたいとも思っていなかった。それはまるでキズキという存在を悪性のウイルスか何かだと思っているようだった。それが僕にはひどく腹立たしかったし、同時に途方もなく虚しかった。そして僕はその行き場のない思いをかき消すように、大学の講義にひとりで出席し、レポートを書き、サークルの集まりにも頻繁に顔を出すようになった。傍目にはいつも通りの学生生活を送っているように見えただろう。だけど僕の内側では、何かが決定的に壊れてしまっていた。夜、ベッドに横たわると決まってあの夜のドライブのことを思い出した。代々木パーキングエリアの缶の温もり。海ほたるから見た東京の夜景。九十九里浜で競走したときの息切れ。犬吠埼で見た夜明け。そして鴨川で見せたあの、悲愁に満ちた表情。どうしてあのとき、もっと深く尋ねなかったのだろう。どうしてあのとき、ハンドルを握ったキズキの手を、もっと強く握り返さなかったのだろう。後悔は際限なく押し寄せ、夜ごと僕を苛んだ。",
   "トヲルとはしばらくの間、連絡を取り合うことができなかった。顔を合わせれば、否応なくあの日のことを思い出してしまう。電話のベルが鳴るたびに心臓が竦んだ。お互いがお互いの傷を見るのが怖かったのだと思う。キズキを失った悲しみを分かち合うことすら、当時の僕たちにはできなかった。 大学の卒業式で久しぶりに顔を合わせたとき、トヲルは見違えるほど痩せていた。スーツの袖から覗く手首は、記憶にあるよりもずっと細かった。「元気か」と尋ねると、トヲルは力なく笑って「まあな」とだけ答えた。その目の奥に、深い疲労と、まだ癒えていない傷の色が見えた気がした。",

   "社会人になってからの僕たちは、それぞれ別の道を歩んだ。僕は出版社に就職し、文芸編集の部署に配属された。皮肉なことに、毎日のように誰かの「書いた言葉」と向き合う仕事だった。原稿を読みながら、ふとキズキの『月を喰らうもの』のことを思い出すことがあった。精緻な構成と、ひとりの少女の報われない愛を描いたあの物語を語るときだけ、饒舌になるキズキの姿が脳裏から離れなかった。トヲルは大手の機械メーカーに、技術職として入社した。入社三年目で早くも昇進し、実直に仕事をこなしているという話を、共通の知人から時折耳にした。住む場所も離れ、生活のリズムも違う僕たちは、自然と会う機会を失っていった。それでも完全に縁が切れることはなかった。年に一度か二度、どちらからともなく連絡を取り、居酒屋で酒を酌み交わす習慣だけは、不思議と絶えることなく続いていた。最初の数年は、キズキの名前を出すことすら避けていた。居酒屋で乾杯をしても、思い出話に花が咲いても、決まってキズキのことだけは触れずにいた。その名前を口にした瞬間、せっかく保っていた均衡が崩れてしまう。そんな予感が互いの中にあったのだと思う。だから僕たちは、当たり障りのない仕事の話や、最近見た映画の話ばかりをした。",

function toFirestoreValue(val) {
  if (val === null || val === undefined) return { nullValue: null };
  if (typeof val === "string") return { stringValue: val };
  if (typeof val === "boolean") return { booleanValue: val };
  if (typeof val === "number") {
    if (Number.isInteger(val)) return { integerValue: String(val) };
    return { doubleValue: val };
  }
  if (Array.isArray(val)) {
    return { arrayValue: { values: val.map(toFirestoreValue) } };
  }
  if (typeof val === "object") {
    const fields = {};
    Object.keys(val).forEach(function (k) {
      if (val[k] !== undefined) fields[k] = toFirestoreValue(val[k]);
    });
    return { mapValue: { fields: fields } };
  }
  return { stringValue: String(val) };
}

function objectToFirestoreDoc(obj) {
  const fields = {};
  Object.keys(obj).forEach(function (k) {
    if (obj[k] !== undefined) fields[k] = toFirestoreValue(obj[k]);
  });
  return { fields: fields };
}

async function loadNovelViaRest() {
  const url = FS_DOC_URL + "?key=" + encodeURIComponent(firebaseConfig.apiKey);
  const res = await fetch(url);
  if (res.status === 404) return null;
  if (!res.ok) {
    const text = await res.text();
    throw new Error("REST read " + res.status + ": " + text.slice(0, 200));
  }
  const doc = await res.json();
  return firestoreDocToObject(doc);
}

async function saveNovelViaRest(payload, idToken) {
  const body = objectToFirestoreDoc(payload);
  const headers = { "Content-Type": "application/json" };
  if (idToken) headers["Authorization"] = "Bearer " + idToken;
  const res = await fetch(FS_DOC_URL + "?key=" + encodeURIComponent(firebaseConfig.apiKey), {
    method: "PATCH",
    headers: headers,
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    const text = await res.text();
    throw new Error("REST write " + res.status + ": " + text.slice(0, 300));
  }
  return res.json();
}

const TITLE_RED = "#c0141c";
function redRange(text) {

function renderTitleRed(text) {

function TitleAssemble({ text, charDelay = 70 }) {
  const { user, setEditing, setShowLogin } = useContext(NovelContext);
  const tapRef = useRef({ n: 0, t: 0 });
  const onTitleTap = () => {
    const now = Date.now();
    const s = tapRef.current;
    s.n = now - s.t < 1500 ? s.n + 1 : 1;
    s.t = now;
    if (s.n >= 5) {
      s.n = 0;
      if (user) setEditing(true);
      else setShowLogin(true);
    }
  };
  const [settled, setSettled] = useState(false);
  const chars = useMemo(() => Array.from(text || ""), [text]);
  // タイトルの改行位置（必要なら調整）
  const breakAfter = useMemo(() => {
    const t = text || "";
    return -1;
  }, [text]);
  useEffect(() => {
    setSettled(false);
    const t = setTimeout(() => setSettled(true), 80);
    return () => clearTimeout(t);
  }, [text]);
  const nodes = [];
  const redIdx = (() => {
    const s = chars.join("");
    const k = s.lastIndexOf("死ね");
    if (k < 0) return null;
    const start = Array.from(s.slice(0, k)).length;
    return [start, start + 2];
  })();
  chars.forEach((ch, i) => {
    if (ch === "\n") {
      nodes.push(React.createElement("br", { key: "nl" + i, "aria-hidden": "true" }));
      return;
    }
    const h = (i * 9301 + 233) % 233280;
    const n = h / 233280;
    const dx = (n - 0.5) * 40,
      dy = ((n * 7) % 1 - 0.5) * 28,
      dr = ((n * 13) % 1 - 0.5) * 8;
    nodes.push(
      React.createElement(
        "span",
        {
          key: "c" + i,
          className: "title-char" + (settled ? " is-settled" : ""),
          style: {
            "--dx": dx + "px",
            "--dy": dy + "px",
            "--dr": dr + "deg",
            ...(redIdx && i >= redIdx[0] && i < redIdx[1] ? { color: TITLE_RED } : {}),
            transitionDelay: i * charDelay + "ms"
          },
          "aria-hidden": "true"
        },
        ch === " " ? " " : ch
      )
    );
    if (i === breakAfter) {
      nodes.push(
        React.createElement("br", {
          key: "br",
          className: "title-break-mobile",
          "aria-hidden": "true"
        })
      );
    }
  });
  return React.createElement(
    "span",
    {
      "aria-label": text,
      onClick: onTitleTap,
      style: { WebkitTapHighlightColor: "transparent", WebkitUserSelect: "none", userSelect: "none" }
    },
    nodes
  );
}

function PageTransition({ routeKey, children }) {
  const [shown, setShown] = useState({ key: routeKey, node: children });
  const [phase, setPhase] = useState("in");
  const latest = useRef(children);
  latest.current = children;
  useEffect(() => {
    if (routeKey === shown.key) return;
    setPhase("out");
    let raf1 = 0, raf2 = 0;
    const t = setTimeout(() => {
      window.scrollTo({ top: 0, behavior: "auto" });
      setShown({ key: routeKey, node: latest.current });
      setPhase("pre");
      raf1 = requestAnimationFrame(() => {
        raf2 = requestAnimationFrame(() => setPhase("in"));
      });
    }, 240);
    return () => { clearTimeout(t); cancelAnimationFrame(raf1); cancelAnimationFrame(raf2); };
  }, [routeKey, children]);
  const node = shown.key === routeKey ? children : shown.node;
  return React.createElement("div", { className: "page-trans is-" + phase }, node);
}

  const num = match ? match[1] : null;
  const chapter = useMemo(
    () => chapters.find((c) => c.num === Number(num)),
    [chapters, num]
  );
  const [fontIndex, setFontIndex] = useState(() => {
    const s = Number(localStorage.getItem("novelblank:fontIndex"));
    return Number.isFinite(s) ? Math.min(SIZES.length - 1, Math.max(0, s)) : 2;
  });
  const [dark, setDark] = useState(() => localStorage.getItem("novelblank:dark") === "1");
  const [progress, setProgress] = useState(0);
  useEffect(() => {
    localStorage.setItem("novelblank:fontIndex", String(fontIndex));
  }, [fontIndex]);
  useEffect(() => {
    localStorage.setItem("novelblank:dark", dark ? "1" : "0");
  }, [dark]);
  useEffect(() => {
    const r = document.documentElement;
    if (dark) r.classList.add("dark");
    else r.classList.remove("dark");
    return () => r.classList.remove("dark");
  }, [dark]);
  useEffect(() => {
    window.scrollTo({ top: 0, behavior: "auto" });
    setProgress(0);
  }, [num]);
  useEffect(() => {
    const onScroll = () => {
      const doc = document.documentElement;
      const max = doc.scrollHeight - doc.clientHeight;
      setProgress(max > 0 ? Math.min(1, Math.max(0, doc.scrollTop / max)) : 0);
    };
    window.addEventListener("scroll", onScroll, { passive: true });

    return () => window.removeEventListener("scroll", onScroll);

              lineHeight: 1.6,
              letterSpacing: "0.08em",
              color: "hsl(var(--foreground))"
            }
          },
          React.createElement(EditableText, {
            value: chapter.title,
            onChange: (v) => updateChapterTitle(chapter.num, v),
            style: {
              background: editing ? "hsl(var(--accent) / 0.06)" : "transparent",
              border: editing ? "1px dashed hsl(var(--accent) / 0.35)" : "none",
              textAlign: "center",
              fontWeight: 300,
              letterSpacing: "0.08em",
              fontSize: "inherit",
              width: "100%",
              color: "inherit"
            }
          })
        ),
        React.createElement("div", {
          style: {
            margin: "2rem auto 0",
            height: "1px",
            width: "2.5rem",
            background: "var(--wine)"
          }
        })
      ),
      React.createElement(
        "div",
        {
          className: "novel-text",
          style: { fontSize, color: "hsl(var(--foreground) / 0.88)" }
        },
        editing
          ? React.createElement("textarea", {
              value: (chapter.paragraphs || []).join("\n\n"),
              onChange: (e) => updateChapterBody(chapter.num, e.target.value),
              style: {
                display: "block",
                width: "100%",
                font: "inherit",
                fontFamily: "var(--font-body)",
                fontSize: "inherit",
                lineHeight: 1.95,
                letterSpacing: "0.04em",
                color: "inherit",
                background: "hsl(var(--accent) / 0.06)",
                border: "1px dashed hsl(var(--accent) / 0.35)",
                borderRadius: "2px",
                padding: "0",
                margin: "0",
                minHeight: "70vh",
                resize: "vertical",
                boxSizing: "border-box",
                outline: "none",
                whiteSpace: "pre-wrap",
                textAlign: "start",
                overflowWrap: "break-word",
                wordBreak: "normal"
              },
              rows: Math.max(20, (chapter.paragraphs || []).length * 3)
            })
          : (chapter.paragraphs || []).map((p, i) => {
              if (typeof p === "string" && p.trim() === "") {
                return React.createElement("div", {
                  key: i,
                  className: "scene-break",
                  role: "separator",
                  "aria-hidden": "true"
                });
              }
              const isDialogue = typeof p === "string" && p.trimStart().startsWith("「");
              return React.createElement(
                "p",
                {
                  key: i,
                  style: isDialogue ? { textIndent: 0 } : undefined,
                  className: isDialogue ? "dialogue" : undefined
                },
                p
              );
            })
      ),
      React.createElement(
        "div",
        { style: { marginTop: "5rem" } },
        React.createElement(
          "div",
          {
            style: {
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              gap: "0.75rem",
              color: "hsl(var(--muted-foreground) / 0.5)"
            }
          },
          React.createElement("span", {
            style: { height: "1px", width: "2rem", background: "currentColor" }
          }),
          React.createElement(
            "span",
            {
              className: "font-display",
              style: { fontSize: "0.75rem", letterSpacing: "0.3em" }
            },
            numStr + " / " + String(totalChapters).padStart(2, "0")
          ),
          React.createElement("span", {
            style: { height: "1px", width: "2rem", background: "currentColor" }
          })
        ),
        React.createElement(
          "div",
          {
            style: {
              marginTop: "2.5rem",
              display: "flex",
              alignItems: "center",
              justifyContent: "space-between",
              gap: "1rem"
            }
          },
          prev
            ? React.createElement(
                "a",
                {
                  href: "#/read/" + prev,
                  style: {
                    display: "flex",
                    alignItems: "center",
                    gap: "0.5rem",
                    fontFamily: "var(--font-body)",
                    fontSize: "0.875rem",
                    color: "hsl(var(--muted-foreground))"
                  }
                },
                React.createElement(Icon, { w: 16, h: 16, d: ["m15 18-6-6 6-6"] }),
                React.createElement("span", { className: "sm-inline" }, "前話")
              )
            : React.createElement("span", { style: { width: "3rem" } }),
          React.createElement(
            "a",
            {
              href: "#/contents",
              style: {
                fontFamily: "var(--font-body)",
                fontSize: "0.75rem",
                letterSpacing: "0.2em",
                color: "hsl(var(--muted-foreground))"
              }
            },
            "目次"
          ),
          next
            ? React.createElement(
                "a",
                {
                  href: "#/read/" + next,
                  style: {
                    display: "flex",
                    alignItems: "center",
                    gap: "0.5rem",
                    fontFamily: "var(--font-body)",
                    fontSize: "0.875rem",
                    color: "hsl(var(--muted-foreground))"
                  }
                },
                React.createElement("span", { className: "sm-inline" }, "次話"),
                React.createElement(Icon, { w: 16, h: 16, d: ["m9 18 6-6-6-6"] })
              )
            : React.createElement("span", { style: { width: "3rem" } })
        ),
        next &&
          nextChapter &&
          React.createElement(
            "p",
            {
              style: {
                marginTop: "1.5rem",
                textAlign: "center",
                fontFamily: "var(--font-body)",
                fontSize: "0.75rem",
                color: "hsl(var(--muted-foreground) / 0.7)",
                letterSpacing: "0.05em"
              }
            },
            nextChapter.title
          ),
        !next &&
          React.createElement(
            "p",
            {
              style: {
                marginTop: "1.5rem",
                textAlign: "center",
                fontFamily: "var(--font-heading)",
                fontSize: "0.875rem",
                letterSpacing: "0.2em",
                color: "hsl(var(--muted-foreground) / 0.7)"
              }
            },
            "── 完 ──"
          )
      )
    )
  );
}

function App() {
  const route = useHashRoute();
  const [meta, setMeta] = useState(() => ({ ...defaultNovelMeta }));
  const [chapters, setChapters] = useState(() =>
    defaultChapters.map((c) => ({ ...c, paragraphs: [...c.paragraphs] }))
  );
  const [editing, setEditing] = useState(false);
  const [saving, setSaving] = useState(false);
  const [dirty, setDirty] = useState(false);
  const [loaded, setLoaded] = useState(false);
  const [loadError, setLoadError] = useState(null);
  const [user, setUser] = useState(null);
  const [authReady, setAuthReady] = useState(false);
  const [showLogin, setShowLogin] = useState(false);

  useEffect(() => {
    if (!auth) {
      setAuthReady(true);
      return;
    }
    const unsub = auth.onAuthStateChanged((u) => {
      setUser(u);
      setAuthReady(true);
      if (!u) setEditing(false);
    });
    return () => unsub();
  }, []);

  // まずローカルのデフォルトで画面を出し、Firestore は裏で同期する
  useEffect(() => {
    setLoaded(true);
  }, []);

  useEffect(() => {
    let cancelled = false;

    try {
      if (localStorage.getItem("novelblank:embedVer") === EMBED_VERSION) {
        const rawMeta = localStorage.getItem("novelblank:meta");
        if (rawMeta) {
          const lm = JSON.parse(rawMeta);
          if (lm && typeof lm === "object") setMeta({ ...defaultNovelMeta, ...lm });
        }
      }
    } catch (e) { console.warn("localStorage meta load failed", e); }

    try {
      const raw = localStorage.getItem("novelblank:embedVer") === EMBED_VERSION ? localStorage.getItem("novelblank:chapters") : null;
      if (raw) {
        const localChs = JSON.parse(raw);
        if (Array.isArray(localChs) && localChs.length > 0) {
          setChapters(
            localChs.map((c) => ({
              ...c,
              paragraphs: Array.isArray(c.paragraphs) ? [...c.paragraphs] : []
            }))
          );
          console.info("Loaded chapters from localStorage");
        }
      }
    } catch (e) {
      console.warn("localStorage chapters load failed", e);
    }

    const applyData = (data) => {
      if (!data) return;
      if (!data.meta || data.meta.embeddedVersion !== EMBED_VERSION) return;
      if (data.meta) {
        setMeta({
          ...defaultNovelMeta,
          ...data.meta,
          characters: data.meta.characters || defaultNovelMeta.characters,
          timeline: data.meta.timeline || defaultNovelMeta.timeline
        });
      }
      if (data.chapters && Array.isArray(data.chapters) && data.chapters.length > 0) {
        setChapters(
          data.chapters.map((c) => ({
            ...c,
            paragraphs: Array.isArray(c.paragraphs) ? [...c.paragraphs] : []
          }))
        );
        try { localStorage.setItem("novelblank:chapters", JSON.stringify(data.chapters)); } catch (e) {}
      }
    };

    (async () => {
      try {
        const data = await loadNovelViaRest();
        if (cancelled) return;
        if (data) {
          applyData(data);
          console.info("Firestore REST data loaded");
          return;
        }
        console.info("No Firestore doc via REST — using defaults");
      } catch (restErr) {
        console.warn("REST load failed, trying SDK:", restErr);
      }
      try {
        if (!db) return;
        const snap = await Promise.race([
          db.collection(STORAGE_COLLECTION).doc(STORAGE_DOC).get(),
          new Promise((_, reject) =>
            setTimeout(() => reject(new Error("Firestore timeout")), 8000)
          )
        ]);
        if (cancelled) return;
        if (snap && snap.exists) {
          applyData(snap.data());
          console.info("Firestore SDK data loaded");
        }
      } catch (err) {
        console.warn("Firebase load failed, using defaults:", err);
        if (!cancelled) setLoadError(String(err && err.message ? err.message : err));
      }
    })();

    return () => {
      cancelled = true;
    };
  }, []);

  const markDirty = useCallback(() => setDirty(true), []);

  const updateMeta = useCallback((partial) => {
    setMeta((m) => ({ ...m, ...partial }));
    setDirty(true);
  }, []);

  const updateChapterTitle = useCallback((num, title) => {
    setChapters((chs) =>
      chs.map((c) => (c.num === num ? { ...c, title } : c))
    );
    setDirty(true);
  }, []);

  const updateChapterBody = useCallback((num, text) => {
    // 空行（2つ以上の改行）で段落分割。全文を一括編集できる
    const cleaned = String(text || "")
      .replace(/\r\n/g, "\n")
      .split(/\n\n+/)
      .map((s) => s.replace(/^\n+|\n+$/g, ""))
      .filter((s) => s.length > 0);
    setChapters((chs) =>
      chs.map((c) => (c.num === num ? { ...c, paragraphs: cleaned } : c))
    );
    setDirty(true);
  }, []);

  const saveToFirebase = useCallback(async () => {
    if (!auth || !auth.currentUser) {
      alert("保存するにはログインが必要です。EDIT からログインしてください。");
      setShowLogin(true);
      return;
    }
    setSaving(true);
    try {
      localStorage.setItem("novelblank:chapters", JSON.stringify(chapters));
      localStorage.setItem("novelblank:embedVer", EMBED_VERSION);
      localStorage.setItem("novelblank:meta", JSON.stringify(meta));
      console.info("Saved chapters to localStorage");
    } catch (lsErr) {
      console.warn("localStorage save failed:", lsErr);
    }
    
    const payload = {
      meta: { ...meta, embeddedVersion: EMBED_VERSION },
      chapters: chapters,
      updatedAt: new Date().toISOString()
    };
    try {
      const idToken = await auth.currentUser.getIdToken();
      try {
        await saveNovelViaRest(payload, idToken);
        setDirty(false);
        console.info("Saved via REST"); alert("クラウドに保存しました");
        return;
      } catch (restErr) {
        console.warn("REST save failed, trying SDK:", restErr);
      }
      if (!db) throw new Error("Firestore に接続できません");
      await db.collection(STORAGE_COLLECTION).doc(STORAGE_DOC).set({
        meta: { ...meta, embeddedVersion: EMBED_VERSION },
        chapters: chapters,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      setDirty(false);
      console.info("Saved via SDK");
    } catch (err) {
      console.error("Save failed:", err);
      setDirty(false);
      alert("クラウド保存に失敗しました（端末内には保存済み）: " + (err && err.message ? err.message : err));
    } finally {
      setSaving(false);
    }
  }, [meta, chapters]);

  const logout = useCallback(async () => {
    try {
      if (auth) await auth.signOut();
      setEditing(false);
      setShowLogin(false);
    } catch (err) {
      console.error("Logout failed:", err);
    }
  }, []);

  const ctx = {
    meta,
    chapters,
    editing,
    setEditing,
    saving,
    dirty,
    updateMeta,
    updateChapterTitle,
    updateChapterBody,
    saveToFirebase,
    user,
    showLogin,
    setShowLogin,
    logout
  };

  let page;
  if (!loaded) {
    page = React.createElement(
      "main",
      {
        style: {
          minHeight: "100vh",
          background: "var(--charcoal)",
          color: "var(--offwhite)",
          display: "flex",
          alignItems: "center",
          justifyContent: "center"
        }
      },
      React.createElement(
        "p",
        {
          className: "font-display",
          style: { letterSpacing: "0.3em", fontSize: "0.85rem", opacity: 0.6 }
        },
        "Loading…"
      )
    );
  } else if (route === "/" || route === "") {
    page = React.createElement(Home);
  } else if (route === "/contents") {
    page = React.createElement(Contents);
  } else if (route.startsWith("/read/")) {
    page = React.createElement(Read, { route });
  } else {
    page = React.createElement(
      "main",
      {
        style: {
          minHeight: "100vh",
          background: "var(--offwhite)",
          color: "var(--charcoal)",
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          padding: "0 1.5rem"
        }
      },
      React.createElement(
        "div",
        { style: { textAlign: "center" } },
        React.createElement(
          "p",
          {
            className: "font-heading",
            style: { fontSize: "1.5rem", letterSpacing: "0.1em", marginBottom: "1.5rem" }
          },
          "ページが見つかりません"
        ),
        React.createElement(
          "a",
          {
            href: "#/",
            style: {
              fontFamily: "var(--font-body)",
              fontSize: "0.875rem",
              color: "var(--charcoal)",
              opacity: 0.6
            }
          },
          "表紙へ戻る"
        )
      )
    );
  }

  return React.createElement(
    NovelContext.Provider,
    { value: ctx },
    React.createElement(
      React.Fragment,
      null,
      React.createElement(PageTransition, { routeKey: route.startsWith("/read/") ? route : (route === "" ? "/" : route) }, page),
      loaded && React.createElement(EditToolbar)
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>

</body>
</html>
